<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MizrCraft: A Birthday Adventure</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="mainMenu">

<h1>MazenCraft</h1>

<h2>A Birthday Adventure</h2>

<button id="playBtn">
PLAY
</button>

</div>




<div id="passwordScreen" class="hidden">


<h2>Enter Password</h2>


<input 
id="passwordInput"
type="password"
placeholder="Password"



<p id="hint">
Hint: Your birthday
</p>


<button id="passwordBtn">
ENTER
</button>


<p id="passwordError"></p>


</div>




<div id="gameUI" class="hidden">

<div id="diamondCounter">
Diamonds:
<span id="diamondAmount">0</span>/10
</div>


<div id="achievementBox"></div>


</div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="world.js"></script>
<script src="player.js"></script>
<script src="ui.js"></script>
<script src="game.js"></script>


</body>

</html>
